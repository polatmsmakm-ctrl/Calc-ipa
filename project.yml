name: Calc
options:
  bundleIdPrefix: com.rashid
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
packages:
  SWCompression:
    url: https://github.com/tsolomko/SWCompression
    from: 4.8.6
targets:
  Calc:
    type: application
    platform: iOS
    dependencies:
      - package: SWCompression
    sources:
      - Sources
      - Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "Puff Dash"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBG
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: false
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: "Files"
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.data
              - public.content
        NSFaceIDUsageDescription: "للتحقق من هويتك"
        NSCameraUsageDescription: "لالتقاط الصور"
        NSPhotoLibraryUsageDescription: "لحذف الصور الأصلية بعد نقلها"
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rashid.calc
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "IconNotes IconWeather IconClock"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
